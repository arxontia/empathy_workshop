<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Εργαστήριο: Σχέσεις, Ενσυναίσθηση & Επικοινωνία</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      color: #f8fafc;
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hub-container {
      width: 100%;
      max-width: 520px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 30px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(165, 180, 252, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 900;
      color: #fde047;
      margin: 0 0 6px 0;
      line-height: 1.3;
    }
    p.subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
      margin: 0 0 24px 0;
      font-weight: 600;
    }
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .game-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.95rem;
      color: #ffffff;
      border: 2px solid transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    }
    .game-card:active {
      transform: scale(0.97);
    }

    /* Χρώματα καρτών */
    .btn-boat {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border-color: #38bdf8;
    }
    .btn-bingo {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      border-color: #a78bfa;
    }
    .btn-conflict {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      border-color: #fb7185;
    }
    .btn-escape {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      border-color: #34d399;
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .btn-icon {
      font-size: 1.5rem;
    }
    .btn-arrow {
      font-size: 1.1rem;
      opacity: 0.7;
    }

    @media (min-width: 768px) {
      .hub-container {
        max-width: 680px;
        padding: 38px 30px;
      }
      h1 {
        font-size: 1.65rem;
      }
      .game-card {
        padding: 18px 22px;
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

  <div class="hub-container">
    <div class="badge">ΔΔΕ ΠΕΛΛΑΣ • ΒΙΩΜΑΤΙΚΟ ΕΡΓΑΣΤΗΡΙΟ</div>
    <h1>Σχέσεις, Ενσυναίσθηση & Επικοινωνία</h1>
    <p class="subtitle">Επιλέξτε τη δραστηριότητα της ομάδας σας:</p>

    <div class="links-list">
      <!-- 1. Η Βάρκα & η Θάλασσα -->
      <a href="παιχνίδι τι είναι στον έλεγχό μου/code_artifact.html" class="game-card btn-boat">
        <div class="btn-content">
          <span class="btn-icon">⛵</span>
          <span>1. Η Βάρκα & η Θάλασσα (Κύκλος Ελέγχου)</span>
        </div>
        <span class="btn-arrow">➔</span>
      </a>

      <!-- 2. Bingo Ενσυναίσθησης -->
      <a href="παιχνίδι bingo/bingo.html" class="game-card btn-bingo">
        <div class="btn-content">
          <span class="btn-icon">🎯</span>
          <span>2. Bingo Ενσυναίσθησης & Επικοινωνίας</span>
        </div>
        <span class="btn-arrow">➔</span>
      </a>

      <!-- 3. Διαφωνία ή Εκφοβισμός -->
      <a href="ekfovismos_i_diafonia.html" class="game-card btn-conflict">
        <div class="btn-content">
          <span class="btn-icon">⚖️</span>
          <span>3. Διαφωνία ή Εκφοβισμός;</span>
        </div>
        <span class="btn-arrow">➔</span>
      </a>

      <!-- 4. Escape Room -->
      <a href="escape_room.html" class="game-card btn-escape">
        <div class="btn-content">
          <span class="btn-icon">🔐</span>
          <span>4. Escape Room Επικοινωνίας</span>
        </div>
        <span class="btn-arrow">➔</span>
      </a>
    </div>
  </div>

</body>
</html>
